[package]
edition      = "2024"
name         = "giants-bobblehead"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "giants-bobblehead"
path = "./src/bin/main.rs"

[dependencies]
# Pinned exactly: RTC-fast retention across deep sleep depends on an upstream
# commented-out register write, so a patch bump can silently break the no-repeat
# clip selection. See `clips::LAST_CLIP`; after any bump, press the button twice
# and confirm the log names two different clips.
esp-hal = { version = "=1.1.1", features = ["esp32", "log-04", "unstable"] }

esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp32",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32", "log-04"] }
log                    = "0.4.27"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
embassy-futures = "0.1.1"
esp-alloc = "0.10.0"
nb = "1.1.0"
esp-backtrace = { version = "0.19.0", features = [
  "esp32",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.17.0", features = ["esp32", "log-04"] }

# Applies to both the lib and the bin target.
[lints.rust]
missing_docs           = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
# mem::forget is generally not safe to do with esp_hal types, especially those
# holding buffers for the duration of a data transfer.
mem_forget = "deny"

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
